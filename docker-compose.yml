services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "8501:8501"
    volumes:
      - ./reports:/app/reports
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    ports:
      - "8000:8000"
    volumes:
      - ./locust/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
