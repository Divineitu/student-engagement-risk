events {}

http {
    resolver 127.0.0.11 valid=5s;

    server {
        listen 8000;
        location / {
            # using a variable here (instead of a static upstream block) forces
            # nginx to re-resolve "api" through the resolver above on every
            # request, which is what actually spreads load across replicas when
            # the compose service is scaled - a static upstream block only
            # resolves once at startup and would keep hitting a single instance
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
        }
    }
}
